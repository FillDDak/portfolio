# 운영 Nginx 설정. 설치 위치: /etc/nginx/sites-available/portfolio (sites-enabled 에 링크)
# - http → https, www → 도메인 본 주소로 301
# - 앱(127.0.0.1:3000)으로 프록시. 화면을 나눠 보내는 스트리밍이 끊기지 않게 버퍼링을 끈다
# - 빌드 결과 정적 파일, 글꼴, 업로드 이미지는 디스크에서 바로 보낸다
# Ubuntu 24.04 의 Nginx 는 1.24 라서 "http2 on;" 대신 listen 에 http2 를 붙인다.

# 등록하지 않은 이름(IP 로 직접 접속 등)은 응답하지 않는다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
    server_tokens off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name fillddak.kr www.fillddak.kr;
    server_tokens off;

    # 인증서 갱신 확인용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://fillddak.kr$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.fillddak.kr;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/fillddak.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fillddak.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://fillddak.kr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fillddak.kr;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/fillddak.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fillddak.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:portfolio_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # PDF(20MB) 업로드가 들어갈 크기
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml
               application/manifest+json image/svg+xml text/x-component;

    # 나머지 보안 헤더는 앱이 붙인다. add_header 를 쓰는 location 은 이 값을 물려받지 않으므로 각자 다시 적는다.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 빌드할 때마다 파일 이름이 바뀌는 JS·CSS
    location /_next/static/ {
        alias /opt/portfolio/current/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location /fonts/ {
        alias /opt/portfolio/current/public/fonts/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 업로드 이미지: 서버가 만든 32자리 파일명만 받는다. 파일명이 바뀌지 않는 한 내용도 그대로라 오래 캐시한다.
    location ~ "^/uploads/([0-9a-f]{32}\.webp)$" {
        alias /var/lib/portfolio/uploads/images/$1;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location /uploads/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 앱은 이 헤더의 마지막 값(TRUSTED_PROXY_HOPS=1)을 방문자 IP 로 쓴다. 방문자가 보낸 값은 덮어쓴다.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
