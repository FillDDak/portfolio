# 인증서를 받기 전에만 쓰는 임시 설정(HTTP 80). 설치 위치: /etc/nginx/sites-available/portfolio
# Let's Encrypt 가 도메인 소유를 확인하는 요청에만 답한다. issue-cert.sh 가 portfolio.conf 로 바꾼다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name fillddak.kr www.fillddak.kr;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
